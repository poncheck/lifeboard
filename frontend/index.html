<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LifeBoard</title>
  <script src="/src/theme.js"></script>
  <link rel="stylesheet" href="/src/style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span>LifeBoard</div>
    <nav>
      <a href="#" id="toggle-config">Configure</a>
      <a href="/admin/integrations.html">Integrations</a>
      <a href="/account.html">Account</a>
      <button id="theme-toggle-btn" type="button">🌙</button>
      <button id="logout-btn" type="button">Log out</button>
    </nav>
  </header>

  <main>
    <section id="config-panel" hidden>
      <h2>Modules</h2>
      <p style="color:var(--text-dim);font-size:0.85rem;">
        Toggle which modules appear on the dashboard. Modules greyed out
        need an integration configured first — see
        <a href="/admin/integrations.html">Integrations</a>.
      </p>
      <div class="panel-list" id="config-panel-list"></div>
    </section>

    <div id="dashboard-grid"></div>
    <p class="empty-state" id="empty-state" hidden>
      No modules enabled yet. Click "Configure" above to turn some on.
    </p>
  </main>

  <script src="/src/api.js"></script>
  <script src="/src/widgets/generic.js"></script>
  <script src="/src/widgets/clock.js"></script>
  <script src="/src/widgets/nutrition.js"></script>
  <script src="/src/widgets/registry.js"></script>
  <script src="/src/dashboard.js"></script>
  <script src="/src/config_panel.js"></script>
  <script src="/src/main.js"></script>
  <script src="/src/register_sw.js"></script>
</body>
</html>
