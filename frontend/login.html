<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LifeBoard — Log in</title>
  <script src="/src/theme.js"></script>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <h1><span class="dot" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-right:6px;"></span>LifeBoard</h1>
      <p class="tagline">Your life, at a glance.</p>

      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email">

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">

        <div class="remember-row">
          <input id="remember_me" name="remember_me" type="checkbox" checked>
          <label for="remember_me">Remember me on this device</label>
        </div>

        <button class="primary" type="submit">Log in</button>
        <p class="error-message" id="error-message"></p>
      </form>
    </div>
  </div>

  <script src="/src/api.js"></script>
  <script src="/src/login.js"></script>
  <script src="/src/register_sw.js"></script>
</body>
</html>
