<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LifeBoard — Setup</title>
  <script src="/src/theme.js"></script>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <h1>Welcome to LifeBoard</h1>
      <p class="tagline">Let's set up your admin account — one-time only.</p>

      <form id="setup-form">
        <label for="full_name">Full name</label>
        <input id="full_name" name="full_name" type="text" required autocomplete="name">

        <label for="date_of_birth">Date of birth</label>
        <input id="date_of_birth" name="date_of_birth" type="date" required autocomplete="bday">

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email">

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="new-password">

        <button class="primary" type="submit">Create account</button>
        <p class="error-message" id="error-message"></p>
      </form>
    </div>
  </div>

  <script src="/src/api.js"></script>
  <script src="/src/setup.js"></script>
  <script src="/src/register_sw.js"></script>
</body>
</html>
