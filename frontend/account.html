<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LifeBoard — Account</title>
  <script src="/src/theme.js"></script>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span>LifeBoard</div>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/admin/integrations.html">Integrations</a>
      <button id="theme-toggle-btn" type="button">🌙</button>
      <button id="logout-btn" type="button">Log out</button>
    </nav>
  </header>

  <main style="max-width:480px;">
    <h2>Account settings</h2>

    <section class="panel-item">
      <h3 style="margin-top:0;">Change password</h3>
      <form id="change-password-form">
        <label for="current_password">Current password</label>
        <input id="current_password" name="current_password" type="password" required autocomplete="current-password">

        <label for="new_password">New password</label>
        <input id="new_password" name="new_password" type="password" required autocomplete="new-password">

        <button class="primary" type="submit">Change password</button>
        <p class="error-message" id="change-password-error"></p>
        <p class="status-line" id="change-password-success" hidden>Password changed — logging you out…</p>
      </form>
    </section>

    <section class="panel-item" style="margin-top:0.8rem;">
      <h3 style="margin-top:0;">Sessions</h3>
      <p class="description">Log out every device signed in to this account, including this one.</p>
      <button class="danger" id="logout-all-btn" type="button">Log out all sessions</button>
      <p class="error-message" id="logout-all-error"></p>
    </section>
  </main>

  <script src="/src/api.js"></script>
  <script src="/src/account.js"></script>
</body>
</html>
